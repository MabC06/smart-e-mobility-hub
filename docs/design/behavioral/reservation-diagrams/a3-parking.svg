l="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="341.3054" y="515.3594">no</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="208.7949" x="30.0679" y="539.6904"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="154.6992" x="40.0679" y="560.9463">Confirm all claims atomically;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="188.7949" x="40.0679" y="574.7451">show arrival deadline / planned end</text><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.4258" x="258.8628" y="539.6904"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="191.4258" x="268.8628" y="560.9463">Rollback; show error; no partial hold</text><ellipse cx="364.5757" cy="618.2881" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="364.5757" cy="618.2881" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="294.1016" x="500.2886" y="374.0928"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="274.1016" x="510.2886" y="395.3486">Show HUB_CRITICAL or validation / capacity error;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="130.0898" x="510.2886" y="409.1475">alternatives hold nothing</text><ellipse cx="647.3394" cy="467.6904" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="647.3394" cy="467.6904" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="230.0996" x="333.3801" y="649.2881"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="210.0996" x="343.3801" y="670.5439">Wait for arrival, cancellation or deadline</text><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.7266" x="372.0667" y="751.4114"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="132.7266" x="382.0667" y="772.6672">Run A2 release workflow</text><ellipse cx="448.4299" cy="824.8108" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="448.4299" cy="824.8108" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="403.7961,703.0869,493.0637,703.0869,505.0637,715.0869,493.0637,727.0869,403.7961,727.0869,391.7961,715.0869,403.7961,703.0869" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="82.543" x="452.4299" y="737.4048">cancel / no-show</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="89.2676" x="403.7961" y="719.0803">Arrival requested?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="505.0637" y="712.7559">yes</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="195.4004" x="350.7297" y="877.8108"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="175.4004" x="360.7297" y="899.0667">Core rechecks owner, time, state</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="116.0801" x="360.7297" y="912.8655">and actual occupancy</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="172.0859" x="362.387" y="993.7329"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="129.4102" x="372.387" y="1014.9888">Early: reject unchanged;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="152.0859" x="372.387" y="1028.7876">at / after deadline: run expiry</text><ellipse cx="448.4299" cy="1074.0317" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="448.4299" cy="1074.0317" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="393.7173,945.4084,503.1426,945.4084,515.1426,957.4084,503.1426,969.4084,393.7173,969.4084,381.7173,957.4084,393.7173,945.4084" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="452.4299" y="979.7263">no</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="109.4253" x="393.7173" y="961.4019">Within arrival window?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="515.1426" y="955.0774">yes</text><polygon fill="#F1F1F1" points="370.1704,1175.3562,526.6895,1175.3562,538.6895,1187.3562,526.6895,1199.3562,370.1704,1199.3562,358.1704,1187.3562,370.1704,1175.3562" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="156.519" x="370.1704" y="1191.3496">Compatible replacement exists?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="341.0527" y="1185.0251">yes</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="538.6895" y="1185.0251">no</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="188.0527" x="229.0212" y="1209.3562"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="168.0527" x="239.0212" y="1230.6121">Atomically transfer whole claim;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="137.4258" x="239.0212" y="1244.4109">include charger if bundled</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.4766" x="437.074" y="1209.3562"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="208.7695" x="447.074" y="1230.6121">Cancel unconsumed claim with reason;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="253.4766" x="447.074" y="1244.4109">keep other vehicle occupancy; offer alternatives</text><ellipse cx="573.8123" cy="1287.9539" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="573.8123" cy="1287.9539" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="402.5688,1127.0317,494.291,1127.0317,506.291,1139.0317,494.291,1151.0317,402.5688,1151.0317,390.5688,1139.0317,402.5688,1127.0317" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="452.4299" y="1161.3496">no</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="91.7222" x="402.5688" y="1143.0251">Space still usable?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="506.291" y="1136.7007">yes</text><polygon fill="#F1F1F1" points="448.4299,1318.9539,460.4299,1330.9539,448.4299,1342.9539,436.4299,1330.9539,448.4299,1318.9539" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="416.6384,1362.9539,480.2214,1362.9539,492.2214,1374.9539,480.2214,1386.9539,416.6384,1386.9539,404.6384,1374.9539,416.6384,1362.9539" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="63.583" x="416.6384" 