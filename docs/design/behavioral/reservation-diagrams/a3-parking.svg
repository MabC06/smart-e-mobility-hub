,398.0928,207.0674,398.0928,195.0674,386.0928,207.0674,374.0928" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="102.7383" x="207.0674" y="390.0862">Charging requested?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="177.9497" y="383.7617">yes</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="321.8057" y="383.7617">no</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="259.1211" x="19.916" y="408.0928"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="239.1211" x="29.916" y="429.3486">Core / M3 validate compatible bay + charger;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="163.418" x="29.916" y="443.1475">prepare one joint interval claim</text><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="136.7188" x="299.0371" y="408.0928"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="116.7188" x="309.0371" y="429.3486">Prepare parking claim</text><polygon fill="#F1F1F1" points="258.4365,461.6904,270.4365,473.6904,258.4365,485.6904,246.4365,473.6904,258.4365,461.6904" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="178.6516,505.6904,338.2214,505.6904,350.2214,517.6904,338.2214,529.6904,178.6516,529.6904,166.6516,517.6904,178.6516,505.6904" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="159.5698" x="178.6516" y="521.6838">All checks and commit succeed?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="149.5339" y="515.3594">yes</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="350.2214" y="515.3594">no</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="208.7949" x="38.9839" y="539.6904"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="154.6992" x="48.9839" y="560.9463">Confirm all claims atomically;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="188.7949" x="48.9839" y="574.7451">show arrival deadline / planned end</text><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="211.4258" x="267.7788" y="539.6904"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="191.4258" x="277.7788" y="560.9463">Rollback; show error; no partial hold</text><ellipse cx="373.4917" cy="618.2881" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="373.4917" cy="618.2881" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.123" x="509.2046" y="374.0928"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="222.123" x="519.2046" y="395.3486">Show validation / quota / capacity conflict;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="130.0898" x="519.2046" y="409.1475">alternatives hold nothing</text><ellipse cx="630.2661" cy="467.6904" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="630.2661" cy="467.6904" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="230.0996" x="329.3015" y="649.2881"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="210.0996" x="339.3015" y="670.5439">Wait for arrival, cancellation or deadline</text><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.7266" x="367.988" y="751.4114"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="132.7266" x="377.988" y="772.6672">Run A2 release workflow</text><ellipse cx="444.3513" cy="824.8108" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="444.3513" cy="824.8108" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="399.7175,703.0869,488.9851,703.0869,500.9851,715.0869,488.9851,727.0869,399.7175,727.0869,387.7175,715.0869,399.7175,703.0869" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="82.543" x="448.3513" y="737.4048">cancel / no-show</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="89.2676" x="399.7175" y="719.0803">Arrival requested?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="500.9851" y="712.7559">yes</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="195.4004" x="346.6511" y="877.8108"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="175.4004" x="356.6511" y="899.0667">Core rechecks owner, time, state</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="116.0801" x="356.6511" y="912.8655">and actual occupancy</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="172.0859" x="358.3083" y="993.7329"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="129.4102" x="368.3083" y="1014.9888">Early: reject unchanged;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="152.0859" x="368.3083" y="1028.7876">at / after deadline: run expiry</text><ellipse cx="444.3513" cy="1074.0317" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="444.3513" cy="1074.0317" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="389.6387,945.4084,499.064,945.4084,511.064,957.4084,499.064,969.4084,389.6387,969.4084,377.6387,957.4084,389.6387,945.4084" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="448.3513" y="979.7263">no</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="109.4253" x="389.6387" y="961.4019">Within arrival window?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="511.064" y="955.0774">yes</text><polygon fill="#F1F1F1" points="366.0918,1175.3562,522.6108,1175.3562,534.6108,1187.3562,522.6108,1199.3562,366.0918,1199.3562,354.0918,1187.3562,366.0918,1175.3562" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="156.519" x="366.0918" y="1191.3496">Compatible replacement exists?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="336.9741" y="1185.0251">yes</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="534.6108" y="1185.0251">no</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="188.0527" x="224.9426" y="1209.3562"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="168.0527" x="234.9426" y="1230.6121">Atomically transfer whole claim;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="137.4258" x="234.9426" y="1244.4109">include charger if bundled</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="273.4766" x="432.9954" y="1209.3562"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="208.7695" x="442.9954" y="1230.6121">Cancel unconsumed claim with reason;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="253.4766" x="442.9954" y="1244.4109">keep other vehicle occupancy; offer alternatives</text><ellipse cx="569.7336" cy="1287.9539" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="569.7336" cy="1287.9539" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="398.4902,1127.0317,490.2124,1127.0317,502.2124,1139.0317,490.2124,1151.0317,398.4902,1151.0317,386.4902,1139.0317,398.4902,1127.0317" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="448.3513" y="1161.3496">no</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="91.7222" x="398.4902" y="1143.0251">Space still usable?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="502.2124" y="1136.7007">yes</text><polygon fill="#F1F1F1" points="444.3513,1318.9539,456.3513,1330.9539,444.3513,1342.9539,432.3513,1330.9539,444.3513,1318.9539" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="412.5598,1362.9539,476.1428,1362.9539,488.1428,1374.9539,476.1428,1386.9539,412.5598,1386.9539,400.5598,1374.9539,412.5598,1362.9539" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="63.583" x="412.5598" y="1378.9473">Private stay?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="383.4421" y="1372.6228">yes</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="59.3076" x="488.1428" y="1372.6228">rental return</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="247.4258" x="37.3525" y="1396.9539"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="227.4258" x="47.3525" y="1418.2097">Atomically mark Active; occupy one space;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="157.3945" x="47.3525" y="1432.0085">consume claim; no rental Trip</text><rect fill="#F1F1F1" height="33.7988" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="199.4434" x="61.3438" y="1478.3503"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="179.4434" x="71.3438" y="1499.6062">Wait for departure or planned end</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="220.1094" x="51.0107" y="1580.4736"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="200.1094" x="61.0107" y="1601.7295">Keep occupancy; flag overstay to M5;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="128.7363" x="61.0107" y="1615.5283">wait for actual departure</text><polygon fill="#F1F1F1" points="91.3486,1532.1492,230.7822,1532.1492,242.7822,1544.1492,230.7822,1556.1492,91.3486,1556.1492,79.3486,1544.1492,91.3486,1532.1492" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="165.0654" y="1566.467">yes</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="139.4336" x="91.3486" y="1548.1426">Still present at planned end?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="79.4922" x="242.7822" y="1541.8181">departing earlier</text><polygon fill="#F1F1F1" points="161.0654,1648.0713,173.0654,1660.0713,161.0654,1672.0713,149.0654,1660.0713,161.0654,1648.0713" style="stroke:#181818;stroke-width:0.5;"/><path d="M331.1309,1695.9214 L331.1309,1711.8701 L311.1309,1715.8701 L331.1309,1719.8701 L331.1309,1735.8188 A0,0 0 0 0 331.1309,1735.8188 L586.2388,1735.8188 A0,0 0 0 0 586.2388,1735.8188 L586.2388,1705.9214 L576.2388,1695.9214 L331.1309,1695.9214 A0,0 0 0 0 331.1309,1695.9214" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M576.2388,1695.9214 L576.2388,1705.9214 L586.2388,1705.9214 L576.2388,1695.9214" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="200.8335" x="337.1309" y="1713.1152">If stop / commit fails, remain Active</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="234.1079" x="337.1309" y="1728.064">and occupied; retry same command key.</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="300.1309" x="11" y="1692.0713"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="244.1543" x="21" y="1713.3271">On actual departure coordinate charging stop;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="280.1309" x="21" y="1727.126">Core completes stay and frees occupancy atomically</text><rect fill="#F1F1F1" height="61.3965" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.7969" x="606.2388" y="1396.9539"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="116.7188" x="616.2388" y="1418.2097">Run S3 atomic return;</te