 textLength="139.4336" x="112.0645" y="1548.1426">Still present at planned end?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="79.4922" x="263.498" y="1541.8181">departing earlier</text><polygon fill="#F1F1F1" points="181.7813,1648.0713,193.7813,1660.0713,181.7813,1672.0713,169.7813,1660.0713,181.7813,1648.0713" style="stroke:#181818;stroke-width:0.5;"/><path d="M351.8467,1695.9214 L351.8467,1711.8701 L331.8467,1715.8701 L351.8467,1719.8701 L351.8467,1735.8188 A0,0 0 0 0 351.8467,1735.8188 L573.6802,1735.8188 A0,0 0 0 0 573.6802,1735.8188 L573.6802,1705.9214 L563.6802,1695.9214 L351.8467,1695.9214 A0,0 0 0 0 351.8467,1695.9214" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M563.6802,1695.9214 L563.6802,1705.9214 L573.6802,1705.9214 L563.6802,1695.9214" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="200.8335" x="357.8467" y="1713.1152">If stop / commit fails, remain Active</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="196.5488" x="357.8467" y="1728.064">and occupied; retry same request.</text><rect fill="#F1F1F1" height="47.5977" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="300.1309" x="31.7158" y="1692.0713"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="244.1543" x="41.7158" y="1713.3271">On actual departure coordinate charging stop;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="280.1309" x="41.7158" y="1727.126">Core completes stay and frees occupancy atomically</text><rect fill="#F1F1F1" height="61.3965" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="242.7969" x="593.6802" y="1396.9539"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="116.7188" x="603.6802" y="1418.