93">and not OUT_OF_SERVICE?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13" x="267.5" y="240.4033">No</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="20" x="472.5" y="240.4033">Yes</text><rect fill="#F4F6F8" height="50.1875" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="240" x="11" y="266.6563"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220" x="21" y="289.1133">Reject request or place in waiting queue</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136" x="63" y="304.207">(Trigger monitoring alert)</text><ellipse cx="131" cy="347.8438" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="131" cy="347.8438" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F4F6F8" height="50.1875" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="216" x="525.5625" y="266.6563"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196" x="535.5625" y="289.1133">Check schedule overlapping claims</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127" x="570.0625" y="304.207">(BR-M1-01 / BR-M3-02)</text><polygon fill="#F4F6F8" points="567.5625,336.8438,699.5625,336.8438,711.5625,348.8438,699.5625,360.8438,567.5625,360.8438,555.5625,348.8438,567.5625,336.8438" style="stroke:#333333;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="132" x="567.5625" y="353.3447">Time slot overlap detected?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="20" x="535.5625" y="346.4268">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13" x="711.5625" y="346.4268">No</text><rect fill="#F4F6F8" height="80.375" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="239" x="354.1875" y="370.8438"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153" x="397.1875" y="393.3008">Execute Conflict Resolution:</text><ellipse cx="419.1875" cy="403.5313" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108" x="425.6875" y="408.3945">Offer alternative slot</text><ellipse cx="371.6875" cy="418.625" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203" x="378.1875" y="423.4883">Suggest alternative port in same Hub</text><ellipse cx="369.6875" cy="433.7188" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207" x="376.1875" y="438.582">Trigger cross-Hub lookup (UC-M4-07)</text><polygon fill="#F4F6F8" points="411.6875,486.2188,535.6875,486.2188,547.6875,498.2188,535.6875,510.2188,411.6875,510.2188,399.6875,498.2188,411.6875,486.2188" style="stroke:#333333;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="124" x="411.6875" y="502.7197">User accepts alternative?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="20" x="379.6875" y="495.8018">Yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13" x="547.6875" y="495.8018">No</text><rect fill="#F4F6F8" height="35.0938" rx="12.5" ry="12.5" style="stroke:#333333;stroke-width:0.5;" width="197" x="279.4375" y="520.2188"/><text fill="#000000" font-family="sans-serif" font-siz