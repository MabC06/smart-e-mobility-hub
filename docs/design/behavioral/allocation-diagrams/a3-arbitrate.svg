<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="798px" preserveAspectRatio="none" style="width:618px;height:798px;background:#FFFFFF;" version="1.1" viewBox="0 0 618 798" width="618px" zoomAndPan="magnify" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>A3 - Settle competing requests for one resource (UC-M4-06, FR-11.M4.1)</title><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="575.1826" x="20" y="32.9951">A3 - Settle competing requests for one resource (UC-M4-06, FR-11.M4.1)</text><ellipse cx="263.8866" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="312.3711" x="107.701" y="87.2969"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="292.3711" x="117.701" y="108.4355">Collect the requests that want the same vehicle,</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="182.8828" x="117.701" y="122.4043">parking space or charging bay</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="278.3516" x="124.7108" y="155.2344"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="258.3516" x="134.7108" y="176.373">Give each request a class level (BR-M4-01)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="349.8887" x="88.9423" y="209.2031"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="329.8887" x="98.9423" y="230.3418">Sort by class level, then request time, then request ID;</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="224.8242" x="98.9423" y="244.3105">(inside the charging class: BR-M3-03)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="149.4805" x="189.1464" y="277.1406"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="129.4805" x="199.1464" y="298.2793">Take the first request</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="286.6074" x="120.5829" y="331.1094"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="266.6074" x="130.5829" y="352.248">Try to claim the resource in one atomic step</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="138.8672" x="130.5829" y="366.2168">(version check in Core)</text><polygon fill="#F1F1F1" points="214.0616,399.0469,313.7115,399.0469,325.7115,411.0469,313.7115,423.0469,214.0616,423.0469,202.0616,411.0469,214.0616,399.0469" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="99.6499" x="214.0616" y="414.855">Claim succeeded?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="183.0533" y="408.4526">yes</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="209.9185" x="325.7115" y="408.4526">no, another claim was committed first</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="133.6484" x="101.3461" y="433.0469"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="113.6484" x="111.3461" y="454.1855">Grant the resource</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="209.2168" x="254.9945" y="433.0469"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="189.2168" x="264.9945" y="454.1855">Answer conflict with the reason</text><polygon fill="#F1F1F1" points="263.8866,473.0156,275.8866,485.0156,263.8866,497.0156,251.8866,485.0156,263.8866,473.0156" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="209.2168" x="159.2782" y="572.7261"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="189.2168" x="169.2782" y="593.8647">Answer conflict with the reason</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="314.668" x="106.5526" y="635.7925"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="294.668" x="116.5526" y="656.9312">Offer an alternative Hub if one exists (UC-M4-05)</text><polygon fill="#F1F1F1" points="221.5704,517.0156,306.2028,517.0156,318.2028,529.0156,306.2028,541.0156,221.5704,541.0156,209.5704,529.0156,221.5704,517.0156" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="267.8866" y="551.2261">yes</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="84.6323" x="221.5704" y="532.8237">More requests?</text><text fill="#000000" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="195.8688" y="526.4214">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="296.3691" x="115.702" y="711.7612"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="276.3691" x="125.702" y="732.8999">Log every decision with its reason (BR-M4-12)</text><ellipse cx="263.8866" cy="776.73" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="263.8866" cy="776.73"