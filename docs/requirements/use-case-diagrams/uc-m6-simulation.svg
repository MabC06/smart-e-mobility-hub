<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; rx: 4; }
      .actor-primary { fill: #0d6efd; stroke: #0b5ed7; stroke-width: 2; }
      .actor-secondary { fill: #6c757d; stroke: #495057; stroke-width: 1.5; }
      .usecase { fill: #ffffff; stroke: #0d6efd; stroke-width: 2; rx: 30; ry: 30; }
      .note-bg { fill: #fff3cd; stroke: #ffe69c; stroke-width: 1; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #212529; text-anchor: middle; }
      .text-bold { font-weight: bold; }
      .title { font-weight: bold; font-size: 14px; fill: #1a1a1a; text-anchor: start; }
      .line { stroke: #212529; stroke-width: 1.5; fill: none; }
      .note-text { font-family: monospace; font-size: 11px; fill: #664d03; text-anchor: start; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- System Boundary -->
  <rect x="200" y="30" width="380" height="450" class="box" />
  <text x="215" y="55" class="title">Smart E-Mobility Hub System</text>

  <!-- Primary Actor: Operator -->
  <g transform="translate(50, 200)">
    <circle cx="25" cy="15" r="12" class="actor-primary" />
    <path d="M 25 27 L 25 60 M 10 38 L 40 38 M 25 60 L 10 90 M 25 60 L 40 90" stroke="#0d6efd" stroke-width="3" fill="none" />
    <text x="25" y="110" class="text text-bold">Operator</text>
  </g>

  <!-- Central Use Case: UC-M6-01 -->
  <g transform="translate(240, 210)">
    <rect x="0" y="0" width="300" height="70" class="usecase" />
    <text x="150" y="30" class="text text-bold">UC-M6-01: Run What-if Simulation</text>
    <text x="150" y="48" class="text text-bold">& Review Recommendations</text>
  </g>

  <!-- Secondary Actors (Right side) -->
  <!-- M1 -->
  <g transform="translate(640, 40)">
    <rect x="0" y="0" width="160" height="40" rx="6" class="actor-secondary" />
    <text x="80" y="25" class="text" fill="#ffffff">M1: Core</text>
  </g>

  <!-- M2 -->
  <g transform="translate(640, 130)">
    <rect x="0" y="0" width="160" height="40" rx="6" class="actor-secondary" />
    <text x="80" y="25" class="text" fill="#ffffff">M2: Reservation & Trip</text>
  </g>

  <!-- M3 -->
  <g transform="translate(640, 220)">
    <rect x="0" y="0" width="160" height="40" rx="6" class="actor-secondary" />
    <text x="80" y="25" class="text" fill="#ffffff">M3: Charging & Scheduling</text>
  </g>

  <!-- M4 -->
  <g transform="translate(640, 310)">
    <rect x="0" y="0" width="160" height="40" rx="6" class="actor-secondary" />
    <text x="80" y="25" class="text" fill="#ffffff">M4: Allocation & Dispatch</text>
  </g>

  <!-- M7 -->
  <g transform="translate(640, 400)">
    <rect x="0" y="0" width="160" height="40" rx="6" class="actor-secondary" />
    <text x="80" y="25" class="text" fill="#ffffff">M7: UI/UX</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M 90 245 L 240 245" class="line" /> <!-- Operator to UC -->
  <path d="M 540 225 L 640 60" class="line" />  <!-- UC to M1 -->
  <path d="M 540 235 L 640 150" class="line" /> <!-- UC to M2 -->
  <path d="M 540 245 L 640 240" class="line" /> <!-- UC to M3 -->
  <path d="M 540 255 L 640 330" class="line" /> <!-- UC to M4 -->
  <path d="M 540 265 L 640 420" class="line" /> <!-- UC to M7 -->

  <!-- Note Box -->
  <g transform="translate(240, 320)">
    <polygon points="0,0 230,0 240,10 240,75 0,75" class="note-bg" />
    <polygon points="230,0 230,10 240,10" fill="#ffe69c" stroke="#ffe69c" />
    <text x="10" y="20" class="note-text">Traces: FR-12, NFR-05, NFR-12, NFR-13</text>
    <text x="10" y="40" class="note-text">Business Rules: BR-M6-03 (D-011)</text>
    <text x="10" y="60" class="note-text">Scenarios: SC-01 to SC-05</text>
  </g>

</svg>