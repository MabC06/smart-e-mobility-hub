{# S1. Login (wireframes-student.md). The code and password are checked by core. #}
{% extends "base.html" %}
{% block title %}Log in · Smart E-Mobility Hub{% endblock %}
{% block content %}
<section class="login">
  <h1>Smart E-Mobility Hub</h1>

  {% if error %}
  <p class="error-block" role="alert">⚠ {{ error }}</p>
  {% endif %}

  <form action="{{ url_for('login_submit') }}" method="post">
    <p>
      <label for="code">Code</label>
      <input id="code" name="code" value="{{ code or '' }}" required autofocus>
    </p>
    <p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
    </p>
    <p><button class="button primary" type="submit">Log in</button></p>
  </form>
</section>
{% endblock %}
