[project]
name = "smart-e-mobility-hub"
version = "0.1.0"
description = "Smart E-Mobility Hub (HK261): coordination of shared electric mobility resources"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/core", "src/main.py"]
strict = true
